#!/bin/env bash

# shellcheck source=/dev/null

# 1. Network Security (IPv4 & IPv6)
  # These settings protect against SYN flood attacks, source routing exploits, MITM redirections, and IP spoofing:

    # Enable SYN cookie protection to mitigate SYN flood attacks
      net.ipv4.tcp_syncookies = 1

    # Increase max SYN backlog queue for better handling of heavy traffic
      net.ipv4.tcp_max_syn_backlog = 2048

    # Disable IP source routing (prevents attackers from routing packets through specific paths)
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0

    # Disable ICMP redirect acceptance (prevents MITM routing redirections)
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0

  # Do not send ICMP redirects (assuming this system is a host, not a router)
    net.ipv4.conf.all.send_redirects = 0
    net.ipv4.conf.default.send_redirects = 0

  # Enable Reverse Path Filtering to prevent IP spoofing
    net.ipv4.conf.all.rp_filter = 1
    net.ipv4.conf.default.rp_filter = 1

  # Log packets with impossible addresses (Martian packets)
    net.ipv4.conf.all.log_martians = 1
    net.ipv4.conf.default.log_martians = 1

  # Ignore regular broadcast echo requests and bogus ICMP error responses
    net.ipv4.icmp_echo_ignore_broadcasts = 1
    net.ipv4.icmp_ignore_bogus_error_responses = 1

  # Disable packet forwarding (if the machine is not acting as a router)
    net.ipv4.ip_forward = 0
    net.ipv6.conf.all.forwarding = 0


# 2. System and Kernel Restrictions
  # These parameters protect against side-channel memory leaks, memory execution exploits, and unexpected local triggers:

    # Enforce maximum Address Space Layout Randomization (ASLR)
      kernel.randomize_va_space = 2

    # Restrict dmesg access to root users only to avoid kernel memory address leaks
      kernel.dmesg_restrict = 1

    # Restrict kernel pointer exposing via /proc files
      kernel.kptr_restrict = 2

    # Restrict ptrace scope to prevent processes from snooping on other processes
      kernel.yama.ptrace_scope = 1

    # Disable the Magic SysRq key combinations to prevent physical access restarts
      kernel.sysrq = 0

    # Disable core dumps for executable binaries running with elevated privileges
      fs.suid_dumpable = 0


# 3. Filesystem Hardening
  # These options secure symbolic and hard link creation to prevent symlink race exploits:

    # Prevent users from creating symlinks to files they do not own
      fs.protected_symlinks = 1

    # Prevent users from creating hardlinks to files they do not own
      fs.protected_hardlinks = 1

#########################################################################################################

# How to Apply the Changes
  # To implement these parameters safely without requiring a full system reboot:
    # 1 - Open the file with superuser privileges using an editor like Nano or Vim:
           # sudo nano /etc/sysctl.d/99-hardening.conf

    # 2 - Paste the hardening blocks provided above into the file and save it.

    # 3 - Reload and execute the configurations immediately:
            # sudo sysctl --system
            # (Alternatively, you can run sudo sysctl -p /etc/sysctl.d/99-hardening.conf to target the specific file.)


# If you want to view your current runtime configuration to verify the changes took place, use the query command:
  # sysctl -a | grep tcp_syncookies


